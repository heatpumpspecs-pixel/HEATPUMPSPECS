name: Validate TechSpecs V2 records and source archives

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "sources/**"
      - "schemas/**"
      - "scripts/**"
      - "requirements.txt"
      - "README.md"
      - "docs/**"
      - "llms.txt"
      - ".github/workflows/validate-v2.yml"
  pull_request:
    paths:
      - "data/**"
      - "sources/**"
      - "schemas/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/validate-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Validate product records against TechSpecs V2
        run: python scripts/validate_product_records.py
      - name: Audit source archive integrity
        run: python scripts/audit_source_archives.py
      - name: Rebuild machine-readable catalogue
        run: python scripts/build_catalogue_index.py
      - name: Ensure committed catalogue is current
        run: git diff --exit-code -- data/catalogue.json
